[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zhishu-inspection"
version = "0.2.0.dev0"
description = "Local e-commerce data quality, analysis and anomaly inspection application"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "shuoshuochen44-commits"}]
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "sqlglot==28.10.1", "SQLAlchemy==2.0.46", "python-calamine==0.6.2", "olefile==0.47"]

[project.optional-dependencies]
desktop = ["pywebview==6.2.1"]
databases = ["PyMySQL==1.1.2", "psycopg[binary]==3.2.13", "pymssql==2.4.4", "oracledb==3.4.2"]

[project.urls]
Repository = "https://github.com/shuoshuochen44-commits/ecommerce-analytics-audit"
Issues = "https://github.com/shuoshuochen44-commits/ecommerce-analytics-audit/issues"

[project.scripts]
zhishu-profile = "zhishu_inspection.cli:main"
zhishu-build-db = "zhishu_inspection.database:main"
zhishu-week2 = "zhishu_inspection.week2_report:main"
zhishu-build = "zhishu_inspection.pipeline:main"
zhishu-serve = "zhishu_inspection.server:main"
zhishu-analyze = "zhishu_inspection.analysis_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zhishu_inspection = ["web/*.html", "web/*.js", "web/*.css"]
