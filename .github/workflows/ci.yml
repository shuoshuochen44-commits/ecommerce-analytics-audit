name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Python tests
        run: python -m pytest --junitxml=work/test-results.xml
      - name: Interface logic tests
        run: node --test tests/analysis_ui.test.cjs tests/connections_ui.test.cjs
      - name: Fixed-question acceptance
        run: python scripts/verify_analysis.py --fixture-gold
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-test-evidence
          path: |
            work/test-results.xml
            artifacts/analysis-acceptance/template-acceptance.json
          if-no-files-found: ignore
          retention-days: 7
